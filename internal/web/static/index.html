<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CapScope</title>
<style>
/* ---- Geist-inspired tokens: monochrome first, one accent, thin borders ---- */
:root{
  --font-sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --bg:#08090c;--panel:#101319;--panel2:#151923;--line:rgba(255,255,255,0.09);--line2:rgba(255,255,255,0.16);--text:#f2f4f8;--muted:#8b93a7;
  --accent:#f89c1c;--err:#f87171;--warn:#fbbf24;--ok:#34d399;--dbg:#8b93a7;--mark:rgba(248,156,28,0.28);
  --err-bg:rgba(248,113,113,0.16);--warn-bg:rgba(251,191,36,0.14);--ok-bg:rgba(52,211,153,0.16);
  --sel:rgba(248,156,28,0.35);
  --shadow:0 16px 70px rgba(0,0,0,0.75),0 0 0 1px rgba(255,255,255,0.04);
}
@media (prefers-color-scheme:light){:root:not([data-theme]){
  --bg:#ffffff;--panel:#ffffff;--panel2:#f4f6fa;--line:rgba(12,17,33,0.11);--line2:rgba(12,17,33,0.2);--text:#0b1020;--muted:#6b7488;
  --accent:#b45309;--err:#dc2626;--warn:#b45309;--ok:#059669;--dbg:#6b7488;--mark:#fde68a;
  --err-bg:rgba(220,38,38,0.09);--warn-bg:rgba(180,83,9,0.14);--ok-bg:rgba(5,150,105,0.10);
  --sel:rgba(0,112,243,0.22);
  --shadow:0 16px 70px rgba(0,0,0,0.12),0 0 0 1px rgba(0,0,0,0.04);}}
:root[data-theme=light]{
  --bg:#ffffff;--panel:#ffffff;--panel2:#f4f6fa;--line:rgba(12,17,33,0.11);--line2:rgba(12,17,33,0.2);--text:#0b1020;--muted:#6b7488;
  --accent:#b45309;--err:#dc2626;--warn:#b45309;--ok:#059669;--dbg:#6b7488;--mark:#fde68a;
  --err-bg:rgba(220,38,38,0.09);--warn-bg:rgba(180,83,9,0.14);--ok-bg:rgba(5,150,105,0.10);
  --sel:rgba(0,112,243,0.22);
  --shadow:0 16px 70px rgba(0,0,0,0.12),0 0 0 1px rgba(0,0,0,0.04);}
:root[data-theme=dark]{
  --bg:#08090c;--panel:#101319;--panel2:#151923;--line:rgba(255,255,255,0.09);--line2:rgba(255,255,255,0.16);--text:#f2f4f8;--muted:#8b93a7;
  --accent:#f89c1c;--err:#f87171;--warn:#fbbf24;--ok:#34d399;--dbg:#8b93a7;--mark:rgba(248,156,28,0.28);
  --err-bg:rgba(248,113,113,0.16);--warn-bg:rgba(251,191,36,0.14);--ok-bg:rgba(52,211,153,0.16);
  --sel:rgba(248,156,28,0.35);
  --shadow:0 16px 70px rgba(0,0,0,0.75),0 0 0 1px rgba(255,255,255,0.04);}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--font-sans);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:var(--sel)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
header{height:48px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg);flex:none}
header .logo{display:flex;align-items:center;gap:8px;color:var(--text)}
header .logo svg{display:block}
header h1{font-size:14px;margin:0;font-weight:600;letter-spacing:-.02em}
header .sp{flex:1}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 9px;font-size:12px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:999px;background:var(--panel);white-space:nowrap}
.chip.live{color:var(--ok);border-color:transparent;background:var(--ok-bg);animation:connPulse 2s infinite ease-in-out}
.chip.bad{color:var(--err);border-color:transparent;background:var(--err-bg)}
#follow.on{background:var(--accent);color:#000;font-weight:600;border-color:transparent}
.range-chip{font-size:11px;padding:2px 8px;height:auto}
.range-chip.on{background:var(--accent);color:#000;font-weight:600;border-color:transparent}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.status-dot.firing{background:var(--err);box-shadow:0 0 6px var(--err)}
.status-dot.resolved{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.status-dot.silenced{background:var(--muted);box-shadow:0 0 6px var(--muted)}
tr.muted td{opacity:0.55;text-decoration:line-through;text-decoration-color:var(--err)}
@keyframes connPulse{0%,100%{opacity:1}50%{opacity:0.6}}
main{flex:1;display:flex;min-height:0}
aside{width:240px;border-right:1px solid var(--line);background:var(--bg);overflow:auto;flex:none;padding-bottom:12px}
aside h2{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 14px 8px}
.app{margin:1px 8px;padding:7px 10px;cursor:pointer;border-radius:6px;border-left:2px solid transparent}
.app:hover{background:var(--panel2)}
.app.sel{background:var(--panel2);border-left-color:var(--accent)}
.app .n{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:500;font-size:13px}
.app .n>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app .m{font-size:12px;color:var(--muted);display:flex;gap:10px;margin-top:2px;font-variant-numeric:tabular-nums}
.badge{font-size:11px;font-weight:600;border-radius:999px;padding:0 7px;line-height:17px;font-variant-numeric:tabular-nums}
.badge.e{background:var(--err-bg);color:var(--err)}.badge.w{background:var(--warn-bg);color:var(--warn)}
section.content{flex:1;display:flex;flex-direction:column;min-width:0}
nav.tabs{display:flex;gap:22px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--bg);flex:none}
nav.tabs button{background:none;border:0;color:var(--muted);padding:11px 0 10px;cursor:pointer;font:inherit;font-size:13px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs button:hover{color:var(--text)}
nav.tabs button.sel{color:var(--text);border-bottom-color:var(--text)}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg);align-items:center;position:relative}
input,select,button.b{height:32px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:0 10px;font:inherit;font-size:13px;transition:border-color .15s,background-color .15s,color .15s}
input:hover,select:hover,button.b:hover{border-color:var(--line2)}
input[type=search]{min-width:220px}
input::placeholder{color:var(--muted)}
button.b{cursor:pointer;display:inline-flex;align-items:center;gap:4px;user-select:none}
button.b.on{border-color:var(--accent);color:var(--accent);background:var(--panel)}
label.chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer}
label.chk input{width:14px;height:14px;accent-color:var(--accent)}
body.sql #q{font-family:var(--font-mono);font-size:13px}
body.sql .hide-sql{display:none}
.pop{position:absolute;top:100%;left:16px;margin-top:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:240px;max-height:280px;overflow:auto;z-index:20;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:1px}
.pop button{background:none;border:0;color:var(--text);text-align:left;cursor:pointer;padding:7px 10px;font:inherit;font-size:13px;border-radius:6px}
.pop button:hover{background:var(--panel2)}
.pop label.chk{padding:6px 10px;border-radius:6px;color:var(--text)}
.pop label.chk:hover{background:var(--panel2)}
#logs{flex:1;overflow:auto;font:12px/20px var(--font-mono);background:var(--bg);min-height:0}
#panes{flex:1;display:none;min-height:0;background:var(--bg)}
.pane+.pane{border-left:1px solid var(--line)}
.pane{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);overflow:hidden}
.pane .ph{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);flex:none;background:var(--bg)}
.pane .ph .bx{background:none;border:0;color:var(--muted);cursor:pointer;font:inherit;padding:0 2px;line-height:1;border-radius:4px}
.pane .ph .bx:hover{color:var(--err)}
.plog{flex:1;overflow:auto;font:12px/20px var(--font-mono);min-height:0}
@media (max-width:900px){#panes{flex-direction:column}#panes .pane+.pane{border-left:0;border-top:1px solid var(--line)}}
.vl-inner{position:relative;width:100%}
.vl-win{position:absolute;left:0;right:0;top:0}
.ln{display:flex;gap:12px;padding:0 16px;height:20px;align-items:center;overflow:hidden;white-space:pre;position:relative}
.ln:hover{background:var(--panel2)}
.ln.sel{background:var(--sel);outline:2px solid var(--accent);outline-offset:-2px}
.ln.json-pretty{height:auto;min-height:44px;padding:8px 16px;overflow:visible}
.ln.json-pretty pre{margin:4px 0 0;font-size:11px;line-height:1.4;color:var(--text-2);white-space:pre-wrap;word-break:break-word}
.ln .t{color:var(--muted);flex:none;font-variant-numeric:tabular-nums;font-size:11px}
.ln .c{color:var(--muted);flex:none;min-width:14px;text-align:right;font-size:11px}
.ln .copyBtn{position:absolute;right:8px;top:0;display:none;opacity:0.6;cursor:pointer;font-size:10px;padding:2px 7px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;line-height:1}
.ln:hover .copyBtn{display:block}
.ln .copyBtn:hover{opacity:1;background:var(--line2)}
.ln.deploy{background:color-mix(in srgb,var(--accent) 8%,transparent);border-left:2px solid var(--accent)}
.ln.wrap{white-space:pre-wrap;overflow-wrap:break-word}
html.nowrap .ln{white-space:pre;overflow:hidden}
#jumpLive{position:fixed;right:16px;bottom:16px;background:var(--accent);color:#000;border:0;border-radius:8px;padding:8px 12px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);display:none;z-index:40}
#jumpLive.show{display:block}
.ln.deploy .c{color:var(--accent)}
.ln.deploy .x{color:var(--accent);font-weight:600}
.ln .x{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:pre}
.ln.error .x{color:var(--err)}.ln.warn .x{color:var(--warn)}.ln.debug .x{color:var(--dbg)}
.ln.e .t{border-left:2px solid var(--err);padding-left:6px;margin-left:-8px}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h3{margin:0 0 12px;font-size:12px;color:var(--muted);font-weight:500}
canvas{width:100%;height:200px;display:block}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
tr.row{cursor:pointer}
tr.row:hover{background:var(--panel2)}
.k{font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;text-transform:uppercase;letter-spacing:.03em;display:inline-block}
.k.oom{background:var(--err-bg);color:var(--err)}.k.crash{background:var(--warn-bg);color:var(--warn)}
.k.killed{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.k.clean_exit{background:var(--ok-bg);color:var(--ok)}
.k.loop{background:var(--warn-bg);color:var(--warn)}
.empty{color:var(--muted);padding:48px 24px;text-align:center;border:1px dashed var(--line);border-radius:10px;margin:16px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 20px;margin:10px 0 16px;font-size:13px}
.kv b{color:var(--muted);font-weight:500}
pre.logbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;max-height:340px;font:12px/1.6 var(--font-mono);white-space:pre-wrap;margin:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:min(780px,92vw);max-height:82vh;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.modal pre{margin:0;padding:14px;overflow:auto;font:12px/1.6 var(--font-mono);white-space:pre-wrap;word-break:break-word}
.ln.json .x{cursor:pointer}
.sum{padding:12px 14px;border-left:2px solid var(--warn);background:var(--panel2);border-radius:0 8px 8px 0;font-size:13px;line-height:1.55}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
h2{font-weight:600;letter-spacing:-.02em}
@media (max-width:760px){aside{display:none}input[type=search]{min-width:140px}}
.cont{font-size:12px;padding:5px 10px;margin-left:16px;border-left:2px solid transparent}
.cont:hover{background:var(--panel2)}
.cont.sel{background:var(--panel2);border-left-color:var(--accent)}
.login-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
.login-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:32px 28px;min-width:320px;max-width:90vw;box-shadow:var(--shadow)}
.login-header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.login-header h2{font-size:18px;margin:0}
.login-muted{color:var(--muted);font-size:13px;margin:0 0 20px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.login-error{color:var(--err);font-size:12px;margin-top:8px;min-height:16px}
</style>
</head>
<body>
<header>
  <span class="logo">
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" rx="4" fill="currentColor"/><path d="M4.5 5.5L7 8L4.5 10.5" stroke="var(--bg)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M8.5 10.5H11.5" stroke="var(--bg)" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
    <h1>CapScope</h1>
  </span>
  <span class="chip" id="conn">connecting</span>
  <span class="sp"></span>
  <span class="chip" id="crashchip" title="Crash snapshots in the last 24h" style="cursor:pointer;display:none"></span>
  <span class="chip" id="contStat" title="Selected container" style="display:none"></span>
  <button class="b" id="themeBtn" title="Color theme">Auto</button>
  <button class="b" id="logoutBtn" title="Log out" style="display:none">Log out</button>
</header>
<main>
  <aside><h2>Apps</h2><div id="apps"></div></aside>
  <section class="content">
    <nav class="tabs" id="tabs">
      <button data-t="logs" class="sel">Logs</button><button data-t="metrics">Metrics</button><button data-t="access">Access</button><button data-t="crashes">Crashes</button><button data-t="alerts">Alerts</button>
    </nav>
    <div id="view-logs" style="display:flex;flex-direction:column;flex:1;min-height:0">
      <button class="b" id="jumpLive" title="Jump to live logs">↓ New logs</button>
      <div class="bar">
        <input type="search" id="q" placeholder="Search logs">
        <div class="range-wrap" style="display:flex;align-items:center;gap:6px;margin-left:10px;">
          <button class="b range-chip hide-sql" id="r5m" data-range="5m">5m</button>
          <button class="b range-chip hide-sql" id="r15m" data-range="15m">15m</button>
          <button class="b range-chip hide-sql" id="r1h" data-range="1h">1h</button>
          <button class="b range-chip hide-sql" id="r24h" data-range="24h">24h</button>
        </div>
        <select id="smode" title="Search mode"><option value="">text</option><option value="rx">regex</option><option value="sql">SQL</option></select>
        <select id="lvl" class="hide-sql"><option value="">all levels</option><option value="error">errors</option><option value="warn,error">warn + error</option><option value="info">info</option><option value="debug">debug</option></select>
        <select id="strm" class="hide-sql"><option value="">stdout + stderr</option><option value="stdout">stdout</option><option value="stderr">stderr</option></select>
        <button class="b hide-sql" id="replicas" style="display:none">All replicas ▾</button>
        <button class="b on hide-sql" id="follow">Follow</button>
        <button class="b hide-sql" id="pause">Pause</button>
        <button class="b hide-sql" id="older">Load older</button>
        <button class="b hide-sql" id="wrap">Wrap</button>
        <button class="b hide-sql" id="jsonBtn" title="Pretty print all JSON log lines inline">JSON</button>
        <a class="chip hide-sql" id="logCSV" href="/api/logs/export" title="Download matching logs as CSV (whole app, all replicas, up to 200k lines)">Download CSV</a>
        <button class="b hide-sql" id="exportSel" style="display:none" title="Export selected lines as CSV">Export (0) lines</button>
        <span class="chip" id="cnt"></span>
        <div class="pop" id="repPop" style="display:none"></div>      </div>
      <div id="panes"></div>
      <div id="logs"></div>
    </div>
    <div id="view-metrics" style="display:none;flex-direction:column;flex:1;min-height:0;overflow:auto;padding:16px">
      <div class="bar" style="margin:-16px -16px 16px;border-top:0">
        <select id="range"><option value="15m">15 minutes</option><option value="1h" selected>1 hour</option><option value="6h">6 hours</option><option value="24h">24 hours</option><option value="7d">7 days</option></select>
        <select id="mcont"><option value="">whole app</option></select>
        <button class="b" id="mdeploy" title="Record a deploy marker so it shows on the charts and log timeline">Record deploy</button>
        <span id="deploys" style="display:none"></span>
      </div>
      <div class="grid">
        <div class="card"><h3>CPU % (sum of cores used)</h3><canvas id="ccpu"></canvas></div>
        <div class="card"><h3>Memory</h3><canvas id="cmem"></canvas></div>
      </div>
    </div>
    <div id="view-access" style="display:none;flex-direction:column;flex:1;min-height:0;overflow:auto;padding:16px">
      <div class="bar" style="margin:-16px -16px 16px;border-top:0">
        <select id="arange"><option value="15m">15 minutes</option><option value="1h" selected>1 hour</option><option value="6h">6 hours</option><option value="24h">24 hours</option><option value="7d">7 days</option></select>
        <div class="range-wrap" style="display:flex;align-items:center;gap:6px;margin-left:10px;">
          <button class="b range-chip" id="aall" data-status="">all</button>
          <button class="b range-chip" id="a2xx" data-status="2xx">2xx</button>
          <button class="b range-chip" id="a4xx" data-status="4xx">4xx</button>
          <button class="b range-chip" id="a5xx" data-status="5xx">5xx</button>
        </div>
        <a class="chip" id="accCSV" href="/api/access/export?range=1h" title="Download parsed access rows as CSV for the selected range">Download CSV</a>
      </div>
      <div class="grid">
        <div class="card"><h3>Totals</h3>
          <div class="kv" id="atotals"></div>
        </div>
        <div class="card"><h3>Requests and errors over time</h3><canvas id="atl"></canvas></div>
        <div class="card"><h3>Status codes</h3><table id="acodes"></table></div>
        <div class="card"><h3>Top paths</h3><table id="apaths"></table></div>
        <div class="card"><h3>Top client IPs</h3><table id="aips"></table></div>
        <div class="card"><h3>Top referrers</h3><table id="arefs"></table></div>
      </div>
    </div>
    <div id="view-crashes" style="display:none;flex:1;min-height:0;overflow:auto;padding:16px"></div>
    <div id="view-alerts" style="display:none;flex:1;min-height:0;overflow:auto;padding:16px"></div>
  </section>
</main>
<script>
"use strict";
const $=s=>document.querySelector(s);
const ROW_H=20,MAXROWS=100000,MAXPANES=4;
const S={app:null,tab:'logs',wrapLines:false,jsonPretty:false,range:'1h',accStatus:'',alertStatus:new Map(),alertMuted:new Map(),sel:new Set(),selKeys:new Set(),selData:new Map(),lastSelKey:null,selCont:null,panes:[],conts:[],apps:[],theme:localStorage.getItem('theme')||'auto',appCrashes:new Map()};

/* ---------- theme ---------- */
const THEMES=['auto','dark','light'];
const THEME_LABEL={auto:'Auto',dark:'Dark',light:'Light'};
function applyTheme(t){
  if(t==='auto')document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
  $('#themeBtn').textContent=THEME_LABEL[t]||'Auto';
}
applyTheme(S.theme);
$('#themeBtn').onclick=()=>{
  S.theme=THEMES[(THEMES.indexOf(S.theme)+1)%THEMES.length];
  localStorage.setItem('theme',S.theme);
  applyTheme(S.theme);
};

async function api(path,init){

/* ---------- virtual list ---------- */
function makeVList(scroller){
  const inner=document.createElement('div');inner.className='vl-inner';scroller.append(inner);
  const win=document.createElement('div');win.className='vl-win';inner.append(win);
  const vl={rows:[],renderRow:null,scroller,inner,win,raf:0};
  const total=()=>vl.rows.length*ROW_H;
  function paint(){
    vl.raf=0;
    const st=scroller.scrollTop,h=scroller.clientHeight;
    const first=Math.max(0,Math.floor(st/ROW_H)-20);
    const last=Math.min(vl.rows.length,Math.ceil((st+h)/ROW_H)+20);
    win.style.transform='translateY('+(first*ROW_H)+'px)';
    win.replaceChildren();
    const frag=document.createDocumentFragment();
    for(let i=first;i<last;i++)frag.append(vl.renderRow(vl.rows[i]));
    win.append(frag);
  }
  vl.schedule=()=>{if(!vl.raf)vl.raf=requestAnimationFrame(paint);};
  const onScroll=()=>vl.schedule();
  scroller.addEventListener('scroll',onScroll);
  vl.destroy=()=>{
    scroller.removeEventListener('scroll',onScroll);
    if(vl.raf)cancelAnimationFrame(vl.raf);
    vl.raf=0;vl.rows=[];
  };
  vl.syncHeight=()=>{inner.style.height=total()+'px';};
  vl.trim=()=>{
    if(vl.rows.length>MAXROWS){
      const cut=vl.rows.length-MAXROWS;
      vl.rows.splice(0,cut);
      scroller.scrollTop=Math.max(0,scroller.scrollTop-cut*ROW_H);
    }
  };
  vl.reset=rows=>{
    vl.rows=rows.slice();vl.trim();vl.syncHeight();
    scroller.scrollTop=total();
    vl.schedule();
  };
  vl.append=(rs,pin)=>{
    if(!rs.length)return;
    for(const r of rs)vl.rows.push(r);
    vl.trim();vl.syncHeight();
    if(pin)scroller.scrollTop=total();
    vl.schedule();
  };
  vl.prepend=rs=>{
    if(!rs.length)return;
    vl.rows.unshift(...rs);vl.trim();vl.syncHeight();
    scroller.scrollTop+=rs.length*ROW_H;
    vl.schedule();
  };
  vl.atBottom=()=>scroller.scrollHeight-scroller.scrollTop-scroller.clientHeight<60;
  vl.toBottom=()=>{vl.syncHeight();scroller.scrollTop=total();};
  return vl;
}

async function runSQL(){

  const logs=$('#logs');logs.style.display='';logs.replaceChildren();
  const pane=createPane(logs,null,false);

  const msg=(level,text)=>({id:1,ts:0,container:'',stream:'',level,line:text});
  pane.vl.reset([msg('','running…')]);
  try{
    const d=await api('/api/sql?query='+encodeURIComponent(sql)+'&limit=5000');
    if(S.panes[0]!==pane)return;

    updateCnt();
    $('#conn').className='chip live';
  }catch(e){

  }
}
const fmtVal=v=>{
  if(v==null)return 'NULL';
  if(typeof v==='number')return Number.isInteger(v)?String(v):v.toFixed(3);
  const s=String(v);
  return s.length>600?s.slice(0,600)+'…':s; // keep blobs (logs_json, inspect) displayable
};
function sqlRows(d){
  const cols=d.columns.map(c=>c.toLowerCase()),ix=n=>cols.indexOf(n);
  const iTs=ix('ts'),iLine=ix('line'),iCont=ix('container'),iApp=ix('app'),iLvl=ix('level'),iStr=ix('stream');
  const skip=new Set([iTs,iCont,iApp,iLvl,iStr,ix('id')].filter(i=>i>=0));
  return (d.rows||[]).map((v,k)=>{
    let ts=0;
    if(iTs>=0&&v[iTs]!=null){
      const n=Number(v[iTs]);
      // logs.ts is nanoseconds, metrics/snapshots.ts are milliseconds, accept seconds too
      if(Number.isFinite(n))ts=n>1e17?Math.round(n/1e6):n>1e11?Math.round(n):n>1e9?n*1000:0;
    }
    let line;
    if(iLine>=0&&v[iLine]!=null)line=String(v[iLine]);
    else line=v.map((x,i)=>skip.has(i)?null:d.columns[i]+'='+fmtVal(x)).filter(x=>x!==null).join('  ');
    const cont=iCont>=0&&v[iCont]?String(v[iCont]):(iApp>=0&&v[iApp]?String(v[iApp]):'');
    return {id:k+1,ts,container:cont,level:iLvl>=0&&v[iLvl]?String(v[iLvl]):'',stream:iStr>=0&&v[iStr]?String(v[iStr]):'',line};
  });
}

function createPane(host,container,split){

async function startPane(pane){
  pane.loaded=false;pane.pending=[];pane.maxId=0;pane.vl.reset([]);
  const my=pane.es=new EventSource('/api/logs/stream?'+params({},pane.name));
  my.onmessage=e=>{
    const r=JSON.parse(e.data);
    if(!pane.loaded||pane.paused)pane.pending.push(r);
    else paneAppend(pane,[r],true);
  };
  my.onerror=()=>{$('#conn').className='chip bad';};
  my.onopen=()=>{$('#conn').className='chip live';$('#conn').textContent='live';};
  // Server emits "event: dropped" (cumulative count) on its 15s ping when the
  // hub had to discard lines for this subscriber under write pressure.
  my.addEventListener('dropped',e=>{const n=e.data|0;if(n){$('#conn').textContent='live ('+n+' dropped)';$('#conn').title=n+' live line(s) dropped by the SSE buffer (write pressure). Persisted logs and CSV export are unaffected.';}});
  try{
    const d=await api('/api/logs?'+params({limit:500},pane.name));
    if(pane.es!==my)return;
    let maxId=0;for(const r of d.logs)if(r.id>maxId)maxId=r.id;
    pane.maxId=maxId;
    // V9: interleave deploy markers that fall inside the loaded window.
    const oldest=d.logs.length?d.logs[0].ts:Date.now()-3600e3;
    const deploys=await loadDeploys(null,oldest);
    pane.vl.reset(mergeDeploys(d.logs,deploys));
    pane.loaded=true;
    flushPending(pane);
    pane.vl.toBottom();
  }catch(e){$('#conn').textContent='load failed';$('#conn').className='chip bad';}
}
function paneAppend(pane,rs,pin){
  const fresh=[];
  for(const r of rs){if(r.d||r.id>pane.maxId){if(!r.d)pane.maxId=r.id;fresh.push(r);}}
  if(fresh.length)pane.vl.append(fresh,pin&&pane.follow&&pane.vl.atBottom());
  updateCnt();
}
function flushPending(pane){
  const p=pane.pending;pane.pending=[];
  if(p.length)paneAppend(pane,p,true);
  updateCnt();
}
function updateCnt(){
  let n=0;for(const p of S.panes)n+=p.vl.rows.length;
  $('#cnt').textContent=n+(sqlOn()?' rows':' lines');
}
$('#follow').onclick=()=>{const nf=!S.panes.some(p=>p.follow);for(const p of S.panes){p.follow=nf;const fw=p.el.querySelector('.bx:nth-child(2)');if(fw)fw.textContent=nf?'👁':'🙈';if(nf)p.vl.toBottom();}$('#follow').classList.toggle('on',nf);};

async function loadOlder(pane){
  const rows=pane.vl.rows;
  if(!rows.length)return;
  try{
    // rows[0] may be a deploy marker (no id); find the first real log row.
    let beforeId=0;for(const r of rows){if(!r.d){beforeId=r.id;break;}}
    if(!beforeId){updateCnt();return;}
    const oldestMs=rows[0].ts;
    const d=await api('/api/logs?'+params({limit:500,before_id:beforeId},pane.name));
    if(d.logs.length){
      const deploys=await loadDeploys(null,d.logs[0].ts);
      // keep only markers older than what is already shown
      const shown=new Set(rows.filter(r=>r.d).map(r=>r.ts));
      const older=deploys.filter(dp=>dp.ts<oldestMs&&!shown.has(dp.ts));
      pane.vl.prepend(mergeDeploys(d.logs,older));
    }
    updateCnt();
  }catch(e){connBad('load older failed');console.warn('capscope: load older failed',e);}
}

/* ---------- row rendering ---------- */
function highlight(el,text){
  const q=$('#q').value;
  if(!q||$('#smode').value!==''){el.textContent=text;return;}
  const lo=text.toLowerCase(),ql=q.toLowerCase();let i=0,j;
  while((j=lo.indexOf(ql,i))>=0){el.append(text.slice(i,j));const m=document.createElement('mark');m.textContent=text.slice(j,j+q.length);el.append(m);i=j+q.length;}
  el.append(text.slice(i));
}
/* JSON detection: cheap prefix check, then one parse (only for visible rows). */
function asJSON(line){
  const s=line.trim();
  if(s.length<2||s[0]!=='{'||s.length>200000)return null;
  try{const o=JSON.parse(s);return (o&&typeof o==='object')?o:null;}catch(e){return null;}
}
/* V8: pretty-print one JSON log line in an overlay (rows stay single-line). */
function showJSON(line){
  const o=asJSON(line);
  if(!o)return;
  const w=document.createElement('div');w.className='modal';
  const box=document.createElement('div');box.className='box';
  const mh=document.createElement('div');mh.className='mh';
  const t=document.createElement('span');t.textContent='JSON log line';
  const x=document.createElement('button');x.className='b';x.textContent='Close';
  mh.append(t,x);
  const pre=document.createElement('pre');pre.textContent=JSON.stringify(o,null,2);
  box.append(mh,pre);w.append(box);
  const close=()=>{w.remove();document.removeEventListener('keydown',esc);};
  const esc=e=>{if(e.key==='Escape')close();};
  x.onclick=close;
  w.onclick=e=>{if(e.target===w)close();};
  document.addEventListener('keydown',esc);
  document.body.append(w);
  x.focus();
}
function lineEl(r){
  // V9: a deploy marker row rendered inline in the timeline.
  if(r.d){
    const m=document.createElement('div');m.className='ln deploy';
    const t=document.createElement('span');t.className='t';t.textContent=r.ts?fmtTime(r.ts):'';
    const c=document.createElement('span');c.className='c';c.textContent='▲';
    const x=document.createElement('span');x.className='x';
    x.textContent='deploy '+(r.version||'')+(r.note?' — '+r.note:'');
    x.title=(r.version||'')+(r.note?'\n'+r.note:'')+'\nrecorded '+fmtDT(r.ts);
    m.append(t,c,x);return m;
  }
  const d=document.createElement('div');d.className='ln '+(r.level||'')+(r.stream==='e'?' e':'');d.dataset.key=lineKey(r);d.dataset.ts=r.ts||'';d.dataset.container=r.container||'';d.dataset.line=r.line||'';
  if(S.selKeys.has(d.dataset.key))d.classList.add('sel');
  const t=document.createElement('span');t.className='t';t.textContent=r.ts?fmtTime(r.ts):'';
  const c=document.createElement('span');c.className='c';c.textContent=(S.conts.find(x=>x.name===r.container)||{}).replica||r.container.split('.')[1]||r.container||'';
  const x=document.createElement('span');x.className='x';x.title=r.line;highlight(x,r.line);
  const o=asJSON(r.line);
  if(o){
    d.classList.add('json');
    x.title='JSON log line — click to pretty-print';
    x.onclick=()=>showJSON(r.line);
    if(S.jsonPretty){
      d.classList.add('json-pretty');
      const pre=document.createElement('pre');pre.textContent=JSON.stringify(o,null,2);
      d.append(pre);
    }
  }
  d.append(t,c,x);
  const cb=document.createElement('span');cb.className='copyBtn';cb.textContent='⧉';cb.title='Copy line';
  cb.onclick=e=>{e.stopPropagation();navigator.clipboard.writeText(r.line).then(()=>{
    cb.textContent='✓';setTimeout(()=>cb.textContent='⧉',900);
  });};
  d.append(cb);
  d.onclick=e=>selToggle(r,e);

}

const fmtNum=n=>(n||0).toLocaleString();
async function loadAccess(){

function renderTotals(host,t){
  const errs=(t.client_err||0)+(t.server_err||0);
  host.replaceChildren();
  [['Requests',fmtNum(t.requests)],['4xx errors',fmtNum(t.client_err)],['5xx errors',fmtNum(t.server_err)],['Unique client IPs',fmtNum(t.unique_ips)],['Traffic',mib(t.bytes)]].forEach(([k,v])=>{
    const a=document.createElement('b');a.textContent=k;const b=document.createElement('span');b.textContent=v;host.append(a,b);
  });
  if(!(t.requests||errs)){const e=document.createElement('div');e.style.color='var(--muted)';e.textContent='No access-log rows in this window yet. CapScope switches a container to access-log mode automatically once its stdout looks like web-server logs (or set ACCESS_LOG=all); excluded containers like the reverse proxy are followed only for this.';host.append(e);}
}
function fillCodes(host,codes,total){
  host.replaceChildren();
  if(!codes.length){host.innerHTML='<tr><td style="color:var(--muted)">no data</td></tr>';return;}
  const tr=document.createElement('tr');['Code','Requests',''].forEach(h=>{const th=document.createElement('th');th.textContent=h;tr.append(th);});
  host.append(tr);

    const tr=document.createElement('tr');

    const td=document.createElement('td');td.innerHTML='<span class="k '+(c.code>=500?'oom':c.code>=400?'crash':'clean_exit')+'">'+pct+'%</span>';
    tr.append(td);host.append(tr);
  }
}
function fillTop(host,rows){
  host.replaceChildren();
  if(!rows.length){host.innerHTML='<tr><td style="color:var(--muted)">no data</td></tr>';return;}
  const tr=document.createElement('tr');['Value','Hits','Errors'].forEach(h=>{const th=document.createElement('th');th.textContent=h;tr.append(th);});
  host.append(tr);
  for(const r of rows.slice(0,20)){
    const tr=document.createElement('tr');tr.className='row';
    const td=document.createElement('td');td.textContent=r.key;td.style.maxWidth='260px';td.title=r.key;

    if(r.errors){e.textContent=fmtNum(r.errors);e.style.color='var(--err)';}
    tr.append(td,n,e);host.append(tr);

function drawAccessTimeline(canvas,pts){
  const dpr=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;
  canvas.width=w*dpr;canvas.height=h*dpr;const g=canvas.getContext('2d');g.scale(dpr,dpr);
  const css=getComputedStyle(document.documentElement);const col=n=>css.getPropertyValue(n).trim();
  g.clearRect(0,0,w,h);
  if(!pts.length){g.fillStyle=col('--muted');g.font='13px system-ui';g.fillText('No requests in this range yet',12,24);return;}
  const L=52,R=8,T=8,B=20,x0=pts[0].ts,x1=pts[pts.length-1].ts||x0+1;
  const max=Math.max(1,...pts.map(p=>Math.max(p.hits,p.errors)))*1.15;
  const X=t=>L+(t-x0)/(x1-x0||1)*(w-L-R),Y=v=>T+(1-v/max)*(h-T-B);
  g.strokeStyle=col('--line');g.fillStyle=col('--muted');g.font='11px system-ui';g.lineWidth=1;
  for(let i=0;i<=4;i++){const v=max*i/4,y=Y(v);g.beginPath();g.moveTo(L,y);g.lineTo(w-R,y);g.stroke();g.fillText(String(Math.round(v)),4,y+4);}
  g.fillText(fmtTime(x0).slice(0,5),L,h-4);const e=fmtTime(x1).slice(0,5);g.fillText(e,w-R-g.measureText(e).width,h-4);
  const line=(key,color)=>{
    g.strokeStyle=color;g.lineWidth=1.6;g.beginPath();
    pts.forEach((p,i)=>{const x=X(p.ts),y=Y(p[key]);i?g.lineTo(x,y):g.moveTo(x,y);});g.stroke();
  };
  line('hits',col('--accent'));
  line('errors',col('--err'));
}

/* ---------- metrics ---------- */
function draw(canvas,pts,key,fmt,limitKey,deploys,crashes){
  const dpr=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;
  canvas.width=w*dpr;canvas.height=h*dpr;const g=canvas.getContext('2d');g.scale(dpr,dpr);
  const css=getComputedStyle(document.documentElement);const col=n=>css.getPropertyValue(n).trim();
  g.clearRect(0,0,w,h);
  if(!pts.length){g.fillStyle=col('--muted');g.font='13px system-ui';g.fillText('No samples in this range yet',12,24);return;}
  const L=52,R=8,T=8,B=20,x0=pts[0].ts,x1=pts[pts.length-1].ts||x0+1;
  let max=Math.max(...pts.map(p=>p[key]));const lim=limitKey?pts[pts.length-1][limitKey]:0;
  if(lim>0&&lim<max*4)max=Math.max(max,lim);max=max*1.1||1;
  const X=t=>L+(t-x0)/(x1-x0||1)*(w-L-R),Y=v=>T+(1-v/max)*(h-T-B);
  g.strokeStyle=col('--line');g.fillStyle=col('--muted');g.font='11px system-ui';g.lineWidth=1;
  for(let i=0;i<=4;i++){const v=max*i/4,y=Y(v);g.beginPath();g.moveTo(L,y);g.lineTo(w-R,y);g.stroke();g.fillText(fmt(v),4,y+4);}
  g.fillText(fmtTime(x0).slice(0,5),L,h-4);const e=fmtTime(x1).slice(0,5);g.fillText(e,w-R-g.measureText(e).width,h-4);
  if(lim>0){g.strokeStyle=col('--err');g.setLineDash([5,4]);g.beginPath();g.moveTo(L,Y(lim));g.lineTo(w-R,Y(lim));g.stroke();g.setLineDash([]);}
  // V9: deploy markers — a dashed vertical line with a ▲ flag and version label.
  if(deploys&&deploys.length){
    g.save();g.font='10px system-ui';
    for(const d of deploys){
      if(d.ts<x0||d.ts>x1)continue;
      const x=X(d.ts);
      g.strokeStyle=col('--accent');g.setLineDash([3,3]);g.lineWidth=1;
      g.beginPath();g.moveTo(x,T);g.lineTo(x,h-B);g.stroke();g.setLineDash([]);
      g.fillStyle=col('--accent');g.beginPath();g.moveTo(x,T);g.lineTo(x-4,T-0);g.lineTo(x+4,T);g.closePath();g.fill();
      const lab=d.version||d.app;const tw=g.measureText(lab).width;
      let lx=x+4;if(lx+tw>w-R)lx=x-4-tw;
      g.fillText(lab,lx,T+9);
    }
    g.restore();
  }
  // Crash markers — red dashed vertical line with a ✕ flag.
  if(crashes&&crashes.length){
    g.save();g.font='10px system-ui';
    for(const c of crashes){
      if(c.ts<x0||c.ts>x1)continue;
      const x=X(c.ts);
      g.strokeStyle=col('--err');g.setLineDash([2,2]);g.lineWidth=1;
      g.beginPath();g.moveTo(x,T);g.lineTo(x,h-B);g.stroke();g.setLineDash([]);
      g.fillStyle=col('--err');g.beginPath();g.moveTo(x-3,T);g.lineTo(x+3,T+6);g.lineTo(x,T+3);g.closePath();g.fill();
      const lab=c.kind?c.kind.replace('_',' '):'crash';const tw=g.measureText(lab).width;
      let lx=x+4;if(lx+tw>w-R)lx=x-4-tw;
      g.fillStyle=col('--err');g.fillText(lab,lx,T+9);
    }
    g.restore();
  }
  g.strokeStyle=col('--accent');g.lineWidth=1.6;g.beginPath();
  pts.forEach((p,i)=>{const x=X(p.ts),y=Y(p[key]);i?g.lineTo(x,y):g.moveTo(x,y);});g.stroke();
}
async function loadMetrics(){
  if(S.app===null)return;
  const p=new URLSearchParams();if(S.app)p.set('app',S.app);p.set('range',$('#range').value);if($('#mcont').value)p.set('container',$('#mcont').value);

/* ---------- deploy markers (V9) ---------- */
const RANGE_MS={'15m':15*60e3,'1h':3600e3,'6h':6*3600e3,'24h':24*3600e3,'7d':7*24*3600e3};
async function loadDeploys(range,sinceMs){
  const ms=RANGE_MS[range]||3600e3;const since=sinceMs||(Date.now()-ms);
  const p=new URLSearchParams();if(S.app)p.set('app',S.app);p.set('since',since);p.set('limit','200');
  try{const d=await api('/api/deploys?'+p);return (d.deploys||[]).slice().reverse();} // oldest→newest for drawing
  catch(e){console.warn('capscope: deploys load failed',e);return [];}
}
async function loadCrashes(range,sinceMs){
  const ms=RANGE_MS[range]||3600e3;const since=sinceMs||(Date.now()-ms);
  const p=new URLSearchParams();if(S.app)p.set('app',S.app);p.set('since',since);p.set('limit','200');
  try{const d=await api('/api/snapshots?'+p);return (d.snapshots||[]).slice().reverse();} // oldest→newest for drawing
  catch(e){console.warn('capscope: crashes load failed',e);return [];}
}
/* Interleave deploy marker rows into ascending-ts log rows by timestamp. */
function mergeDeploys(rows,deploys){
  if(!deploys||!deploys.length)return rows;
  const out=[];let i=0;
  for(const r of rows){
    while(i<deploys.length&&deploys[i].ts<=r.ts){out.push(deployRow(deploys[i++]));}
    out.push(r);
  }
  while(i<deploys.length)out.push(deployRow(deploys[i++]));
  return out;
}
function deployRow(d){return {d:1,ts:d.ts,version:d.version,note:d.note,app:d.app};}
function renderDeployList(deploys){
  const host=$('#deploys');if(!host)return;
  host.replaceChildren();
  if(!deploys.length){host.style.display='none';return;}
  host.style.display='';
  const lab=document.createElement('span');lab.className='chip';lab.textContent=deploys.length+' deploy'+(deploys.length>1?'s':'')+' in range';
  host.append(lab);
  deploys.slice().reverse().forEach(d=>{ // newest first
    const c=document.createElement('span');c.className='k clean_exit';c.style.cursor='default';
    c.textContent=(d.version||d.app)+' · '+ago(d.ts);
    c.title=(d.version||'')+(d.note?'\n'+d.note:'')+'\n'+fmtDT(d.ts);
    host.append(c);
  });
}
async function recordDeploy(){
  if(!S.app){alert('Select an app first (deploy markers are per app).');return;}
  const version=prompt('Version or label for this deploy of "'+S.app+'":');
  if(version===null)return;
  try{
    const created=await api('/api/deploys',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({app:S.app,version:version.trim()})});
    if(S.tab==='metrics')loadMetrics();
    if(S.tab==='logs')insertLiveDeployMarkers(created);
    if(S.tab==='crashes')loadCrashes();
  }catch(e){alert('Record failed: '+(e.message||e));}
}
/* Append a freshly recorded deploy as a marker row to the visible log pane. */
function insertLiveDeployMarkers(created){
  if(!created||!S.panes.length)return;
  const row=deployRow({ts:created.ts,version:created.version,note:created.note,app:created.app});
  for(const p of S.panes){if(p.vl)p.vl.append([row],true);}
  updateCnt();
}

/* ---------- crashes ---------- */
async function loadCrashes(){
  const box=$('#view-crashes');box.innerHTML='';
  const only=S.crashOnlyApp&&S.app;
  const d=await api('/api/snapshots?limit=100'+(only?'&app='+encodeURIComponent(S.app):''));
  const bar=document.createElement('div');bar.style.marginBottom='12px';
  const lab=document.createElement('label');lab.className='chk';
  const cb=document.createElement('input');cb.type='checkbox';cb.id='onlyapp';cb.checked=!!only;cb.onchange=()=>{S.crashOnlyApp=cb.checked;loadCrashes();};
  lab.append(cb,'only show '+(S.app||'selected app'));bar.append(lab);box.append(bar);
  if(!d.snapshots.length){const e=document.createElement('div');e.className='empty';e.textContent='No crash snapshots yet. They are saved automatically when a container dies with a non-zero exit code or is OOM killed.';box.append(e);return;}
  const tb=document.createElement('table');tb.innerHTML='<tr><th>When</th><th>App</th><th>Kind</th><th>Exit</th><th>Summary</th></tr>';
  d.snapshots.forEach(s=>{
    const tr=document.createElement('tr');tr.className='row';
    const cells=[fmtDT(s.ts)+' ('+ago(s.ts)+')',s.app,null,String(s.exit_code),s.summary];
    cells.forEach((c,i)=>{const td=document.createElement('td');if(i===2){const k=document.createElement('span');k.className='k '+s.kind;k.textContent=s.kind.replace('_',' ');td.append(k);
      if(s.restarts_window>=2){const rp=document.createElement('span');rp.className='k loop';rp.textContent='↻ '+s.restarts_window;rp.title=s.restarts_window+' deaths of this container inside the restart-loop window';rp.style.marginLeft='6px';td.append(rp);}
    }else td.textContent=c;tr.append(td);});
    tr.onclick=()=>openCrash(s.id);tb.append(tr);
  });
  box.append(tb);
}
async function openCrash(id){
  const s=await api('/api/snapshots/'+id);const box=$('#view-crashes');box.innerHTML='';
  const back=document.createElement('button');back.className='b';back.textContent='Back to list';back.onclick=loadCrashes;
  const dl=document.createElement('a');dl.href='/api/snapshots/'+id+'/export';dl.textContent='Download as Markdown';dl.style.marginLeft='12px';
  const h=document.createElement('h2');h.textContent=`${s.app}: ${s.kind.replace('_',' ')} (exit ${s.exit_code})`;
  const sum=document.createElement('div');sum.className='sum';sum.textContent=s.summary;
  const kv=document.createElement('div');kv.className='kv';
  const cells=[['Time',fmtDT(s.ts)],['Container',s.container],['Image',s.image],['Uptime',s.uptime_sec+'s'],['Restart count',s.restart_count],['Memory limit',s.mem_limit?mib(s.mem_limit):'none'],['Docker error',s.error||'none']];
  if(s.die_ts)cells.splice(1,0,['Died at',fmtDT(s.die_ts)]);
  if(s.restarts_window>=2)cells.push(['Deaths in window',s.restarts_window+' — restart loop']);
  if(s.deploy){
    const gapMs=s.ts-s.deploy.ts,gap=Math.round(gapMs/60000);
    const near=gapMs<15*60000; // deploy within 15 min before the crash
    cells.push(['Last deploy',(s.deploy.version||'')+' · '+fmtDT(s.deploy.ts)+(gap>=0?' ('+gap+'m before crash)':'')+(near?' — ⚠ recent deploy':'')]);
  }
  cells.forEach(([k,v])=>{const a=document.createElement('b'),b=document.createElement('span');a.textContent=k;b.textContent=v;kv.append(a,b);});
  const card=document.createElement('div');card.className='card';card.innerHTML='<h3>Memory before death</h3><canvas id="cs"></canvas>';
  const lh=document.createElement('h3');lh.textContent=`Last ${s.logs.length} log lines`;lh.style.color='var(--muted)';
  const pre=document.createElement('pre');pre.className='logbox';
  pre.textContent=s.logs.map(l=>`${fmtTime(l.ts)} ${l.stream==='e'?'err':'out'} ${l.line}`).join('\n');
  box.append(back,dl,h,sum,kv,card,lh,pre);pre.scrollTop=pre.scrollHeight;
  draw($('#cs'),s.metrics,'mem',v=>mib(v),'mem_limit');
}
async function loadCrashCounts(){
  try{
    const d=await api('/api/snapshots?limit=200');const now=Date.now();S.appCrashes=new Map();
    for(const s of d.snapshots){if(now-s.ts<864e5){S.appCrashes.set(s.app,(S.appCrashes.get(s.app)||0)+1);}}
  }catch(e){console.warn('capscope: crash counts failed',e);}
}
async function crashChip(){
  await loadCrashCounts();let n=0;for(const v of S.appCrashes.values())n+=v;
  const c=$('#crashchip');c.style.display=n?'':'none';c.textContent=n+' crash'+(n>1?'es':'')+' in 24h';c.className='chip bad';
}

/* ---------- alerts ---------- */
const ALERT_KIND={deadman:'Dead man',restart_loop:'Restart loop',metric:'Metric',log_pattern:'Log pattern'};
async function loadAlerts(){
  const box=$('#view-alerts');box.innerHTML='';
  let meta={rules:[],channels:[],enabled:false},hist={alerts:[]};
  try{meta=await api('/api/alerts/rules');}catch(e){connBad('alerts meta failed');}
  try{hist=await api('/api/alerts?limit=100');}catch(e){connBad('alerts history failed');}
  const now=Date.now();
  S.alertStatus=new Map();
  meta.rules.forEach(r=>{S.alertStatus.set(r.name, hist.alerts.some(a=>a.rule===r.name&&now-a.ts<3e5)?'firing':'resolved');});
  const bar=document.createElement('div');bar.className='bar';bar.style.marginBottom='12px';
  const t=document.createElement('button');t.className='b';t.textContent='Send test alert';
  t.disabled=!meta.channels.length;
  t.title=meta.channels.length?'Send a test message to: '+meta.channels.join(', '):'No notification channels configured (set ALERT_WEBHOOK_URL etc.)';
  t.onclick=async()=>{
    try{const d=await api('/api/alerts/test',{method:'POST'});
      alert('Channel results:\n'+Object.entries(d.results).map(([k,v])=>k+': '+v).join('\n'));
    }catch(e){alert('Test failed: '+(e.message||e));}
  };
  bar.append(t);box.append(bar);

  const rc=document.createElement('div');rc.className='card';
  rc.innerHTML='<h3>Rules</h3>';
  if(!meta.rules.length){
    const p=document.createElement('div');p.className='empty';
    p.textContent=meta.enabled?'No rules loaded. Create a JSON rules file (ALERTS_FILE) with deadman, restart_loop, metric or log_pattern rules.':'Alerting is off: no rules file found.';
    rc.append(p);
  }else{
    const tb=document.createElement('table');tb.innerHTML='<tr><th>Name</th><th>Kind</th><th>Apps</th><th>Condition</th><th>Repeat</th><th>Status</th><th>Mute</th></tr>';
    meta.rules.forEach(r=>{
      const tr=document.createElement('tr');
      const cond=r.kind==='deadman'?`no logs for ${r.for}`
        :r.kind==='restart_loop'?`> ${r.count} deaths in ${r.window}`
        :r.kind==='metric'?`${r.metric} ${r.op} ${r.value} for ${r.for}`
        :`"${r.pattern}" ≥ ${r.hits} hits in ${r.window}`;
      const st=S.alertStatus.get(r.name)||'resolved';
      const muted=S.alertMuted.get(r.name,0)>now;
      const dots={firing:'firing',resolved:'resolved',silenced:'silenced'};
      const nameTd=document.createElement('td');nameTd.textContent=r.name;if(muted)nameTd.classList.add('muted');tr.append(nameTd);
      [[ALERT_KIND[r.kind]||r.kind],[(r.apps||[]).join(', ')||'all'],[cond],[r.repeat||'']].flat().forEach(v=>{const td=document.createElement('td');td.textContent=v;if(muted)td.classList.add('muted');tr.append(td);});
      const stTd=document.createElement('td');const dot=document.createElement('span');dot.className='status-dot '+st;dot.title=st;stTd.append(dot,document.createTextNode(' '+st));tr.append(stTd);
      const muTd=document.createElement('td');
      const m1=document.createElement('button');m1.className='b';m1.style.fontSize='10px';m1.style.padding='2px 6px';m1.textContent='1h';m1.title='Mute '+r.name+' for 1 hour';
      m1.onclick=()=>muteRule(r.name,3600e3);
      const m24=document.createElement('button');m24.className='b';m24.style.fontSize='10px';m24.style.padding='2px 6px';m24.textContent='24h';m24.title='Mute '+r.name+' for 24 hours';
      m24.onclick=()=>muteRule(r.name,86400e3);
      const un=document.createElement('button');un.className='b';un.style.fontSize='10px';un.style.padding='2px 6px';un.textContent='unmute';un.style.display=muted?'':'none';un.title='Unmute '+r.name;
      un.onclick=()=>{S.alertMuted.delete(r.name);loadAlerts();};
      muTd.append(m1,m24,un);if(muted){m1.style.display='none';m24.style.display='none';}
      tr.append(muTd);
      tb.append(tr);
    });
    rc.append(tb);
  }
  box.append(rc);

  const ac=document.createElement('div');ac.className='card';ac.style.marginTop='12px';
  ac.innerHTML='<h3>Recent alerts</h3>';
  hist={alerts:[]};
  try{hist=await api('/api/alerts?limit=100');}catch(e){connBad('alerts history failed');}
  if(!hist.alerts.length){
    const p=document.createElement('div');p.className='empty';p.textContent='No alerts have fired yet.';ac.append(p);
  }else{
    const tb=document.createElement('table');tb.innerHTML='<tr><th>When</th><th>Rule</th><th>App</th><th>Kind</th><th>Message</th></tr>';
    hist.alerts.forEach(a=>{
      const tr=document.createElement('tr');
      const cells=[fmtDT(a.ts)+' ('+ago(a.ts)+')',a.rule,a.app,ALERT_KIND[a.kind]||a.kind,a.message];
      cells.forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td);});
      tb.append(tr);
    });
    ac.append(tb);
  }
  box.append(ac);
}
function muteRule(name,forMs){
  S.alertMuted.set(name,Date.now()+forMs);
  loadAlerts();
}

addEventListener('DOMContentLoaded',()=>{
  function showLogin(){$('#loginOverlay').style.display='flex';}
  function hideLogin(){$('#loginOverlay').style.display='none';}
  async function checkSession(){
    try{await api('/api/session');return true;}catch(e){return false;}
  }
  $('#loginForm').onsubmit=async(e)=>{
    e.preventDefault();
    const err=$('#loginError');err.style.display='none';
    try{
      const d=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        username:$('#loginUser').value,password:$('#loginPass').value
      })});
      localStorage.setItem('capscope_token',d.token);
      $('#loginUser').value='';$('#loginPass').value='';
      hideLogin();
      refreshApps().then(()=>crashChip());
    }catch(ex){err.textContent='Invalid username or password.';err.style.display='';}
  };
  $('#loginReveal').onclick=()=>{
    const i=$('#loginPass');const shown=i.type==='text';
    i.type=shown?'password':'text';
    $('#loginReveal').innerHTML=shown?'<i data-lucide="eye"></i>':'<i data-lucide="eye-off"></i>';
    lucide&&lucide.createIcons&&lucide.createIcons({nodes:[$('#loginReveal').firstElementChild]});
  };
  $('#logoutBtn').onclick=async()=>{
    try{await api('/api/logout',{method:'POST'});}catch(e){}
    localStorage.removeItem('capscope_token');
    location.reload();
  };
  (async()=>{
    const ok=await checkSession();
    if(ok){
      $('#logoutBtn').style.display='';
      await loadCrashCounts();
      refreshApps().then(()=>crashChip());
      setInterval(refreshApps,10000);setInterval(crashChip,60000);
    }else{
      showLogin();
    }
  })();
  document.addEventListener('keydown',e=>{
    if(e.key==='/'&&!e.target.matches('input,textarea,select,button,[contenteditable]')){
      e.preventDefault();$('#q').focus();
    }
  });
});
</script>
