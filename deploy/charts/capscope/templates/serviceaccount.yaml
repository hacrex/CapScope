apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "capscope.serviceAccountName" . }}
  labels:
    {{- include "capscope.labels" . | nindent 4 }}
  {{- with .Values.rbac.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if .Values.rbac.automountServiceAccountToken }}
automountServiceAccountToken: true
{{- end }}
