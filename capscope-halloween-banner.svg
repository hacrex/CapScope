<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#141414;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0e0e0e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b00ff;stop-opacity:1" />
    </linearGradient>
    <filter id="nbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="6" dy="6" result="offset" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="offset" />
      </feMerge>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="3" dy="3" result="offset" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.8" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="offset" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Halloween border frame (neubrutalism) -->
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#000000" stroke-width="12" />
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="#ff6b00" stroke-width="4" />

  <!-- Subtle bats -->
  <g fill="#1a1a2e" opacity="0.15">
    <path d="M150 220 Q180 200 210 220 Q180 240 150 220" />
    <path d="M950 180 Q980 160 1010 180 Q980 200 950 180" />
    <path d="M200 400 Q230 380 260 400 Q230 420 200 400" />
    <path d="M1050 420 Q1080 400 1110 420 Q1080 440 1050 420" />
  </g>

  <!-- Moon -->
  <circle cx="1060" cy="120" r="50" fill="#2a2a3e" />
  <circle cx="1045" cy="110" r="14" fill="#0a0a0a" />

  <!-- Pumpkin (top left decorative) -->
  <g transform="translate(120, 140)">
    <ellipse cx="0" cy="0" rx="45" ry="52" fill="#ff6b00" />
    <ellipse cx="0" cy="0" rx="40" ry="48" fill="#e55a00" />
    <!-- face -->
    <rect x="-14" y="-8" width="8" height="14" fill="#000" rx="2" />
    <rect x="6" y="-8" width="8" height="14" fill="#000" rx="2" />
    <ellipse cx="0" cy="8" rx="10" ry="6" fill="#000" />
    <!-- stem -->
    <rect x="-6" y="-42" width="12" height="14" fill="#4a7c23" />
    <path d="M0 -42 Q-4 -50 4 -50 Q0 -42 0 -42" fill="none" stroke="#3a5c18" stroke-width="3" />
  </g>

  <!-- Ghost container (right side decorative) -->
  <g transform="translate(940, 340)">
    <rect x="0" y="0" width="90" height="70" fill="#ffffff" rx="16" filter="url(#nbShadow)" />
    <path d="M0 30 Q20 20 40 30 Q60 20 90 30 V50 H0 Z" fill="#ffffff" />
    <circle cx="22" cy="36" r="5" fill="#000" />
    <circle cx="68" cy="36" r="5" fill="#000" />
    <path d="M32 46 Q45 42 58 46" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" />
    <!-- container lines -->
    <rect x="10" y="52" width="20" height="4" fill="#cccccc" rx="2" />
    <rect x="60" y="52" width="20" height="4" fill="#cccccc" rx="2" />
  </g>

  <!-- Central card -->
  <rect x="300" y="180" width="600" height="290" fill="url(#cardGrad)" stroke="#000000" stroke-width="8" filter="url(#nbShadow)" />
  <rect x="306" y="186" width="588" height="278" fill="none" stroke="#ff6b00" stroke-width="3" />

  <!-- Accent line -->
  <rect x="320" y="230" width="8" height="34" fill="url(#accentGrad)" />

  <!-- CapScope logo text -->
  <text x="350" y="275" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="900" fill="#ffffff" filter="url(#textShadow)" letter-spacing="-2">CapScope</text>
  <text x="350" y="310" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ff6b00" filter="url(#textShadow)">🎃 Persistent Container Logs &amp; Crash Snapshots</text>

  <!-- Tagline -->
  <text x="320" y="365" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#e0e0e0">Dozzle with memory. No more vanishing logs.</text>
  <text x="320" y="395" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#a0a0a0">Self-hosted • SQLite • Crash snapshots • CPU/Memory history • Any Docker host</text>

  <!-- Feature chips -->
  <g transform="translate(320, 430)">
    <rect x="0" y="0" width="150" height="40" fill="#1a1a2e" stroke="#000000" stroke-width="3" rx="6" filter="url(#nbShadow)" />
    <text x="15" y="27" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#00ff41">OOM Snapshots</text>
    <rect x="170" y="0" width="150" height="40" fill="#1a1a2e" stroke="#000000" stroke-width="3" rx="6" filter="url(#nbShadow)" />
    <text x="185" y="27" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#00ff41">FTS5 Search</text>
    <rect x="340" y="0" width="150" height="40" fill="#1a1a2e" stroke="#000000" stroke-width="3" rx="6" filter="url(#nbShadow)" />
    <text x="355" y="27" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#00ff41">Deploy Markers</text>
  </g>

  <!-- CTA button -->
  <rect x="430" y="495" width="340" height="56" fill="#ff6b00" stroke="#000000" stroke-width="5" rx="10" filter="url(#nbShadow)" cursor="pointer" />
  <text x="600" y="533" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="#000000" text-anchor="middle">Star on GitHub</text>

  <!-- Halloween footer -->
  <text x="600" y="595" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#666666" text-anchor="middle">Happy Halloween 🎃 • Oct 31, 2026 • github.com/hacrex/CapScope</text>

  <!-- Small container icon bottom left -->
  <g transform="translate(40, 520)">
    <rect x="0" y="0" width="70" height="50" fill="#141414" stroke="#000000" stroke-width="3" rx="4" />
    <rect x="5" y="5" width="10" height="10" fill="#ff6b00" />
    <rect x="20" y="5" width="10" height="10" fill="#00ff41" />
    <rect x="35" y="5" width="10" height="10" fill="#8b00ff" />
    <rect x="50" y="5" width="10" height="10" fill="#ff6b00" />
    <text x="35" y="34" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">CAPSCOPE</text>
  </g>
</svg>
