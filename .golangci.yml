version: 2

build:
  tags:
    - sqlite_omit_load_extension
    - fts5

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - writeerrcheck
  disable:
    - gochecknoglobals
    - gochecknoinits
    - goconst
    - gocritic
    - godot
    - godox
    - goerr113
    - gofumpt
    - goimports
    - golint
    - gomnd
    - goprintffuncname
    - gosec
    - depguard
    - lll
    - missmiss
    - nlreturn
    - nosnakecase
    - nonamedreturns
    - nosprintfhostport
    - parametrizerm
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - tparallel
    - varcheck
    - whitespace
  presets:
    - bugs
    - unused
  fast: false

linters-settings:
  gosimple:
    checks: all
  staticcheck:
    checks: all

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosimple
        - staticcheck

run:
  timeout: 10m
